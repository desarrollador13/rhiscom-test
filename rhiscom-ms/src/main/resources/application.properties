spring.application.name=rhiscom-ms


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/rhiscom_db
spring.datasource.username=${POSTGRES_USER:rhiscom}
spring.datasource.password=${POSTGRES_PASSWORD:rhiscom}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
